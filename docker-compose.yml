services:
  backend:
    build:
      context: ./backend
    container_name: civicverse_rebuilt_backend
    ports:
      - "3003:3003"
      - "8080:8080"
    volumes:
      - ./data:/data
    networks:
      - civicnet

  frontend:
    build:
      context: ./frontend
    container_name: civicverse_rebuilt_frontend
    ports:
      - 3000:80
    depends_on:
      - backend
    networks:
      - civicnet

  ollama:
    image: ollama/ollama:latest
    container_name: civicverse_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - civicnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

networks:
  civicnet:
    driver: bridge
