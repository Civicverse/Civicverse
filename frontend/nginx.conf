server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # WebSocket Proxy (Game Server)
  location /ws {
    proxy_pass http://civicverse_rebuilt_backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  # Identity/Job/Gov Server Routes (Port 3003)
  location /api/identity {
    proxy_pass http://civicverse_rebuilt_backend:3003;
    proxy_set_header Host $host;
  }
  
  location /api/wallet/backup {
    proxy_pass http://civicverse_rebuilt_backend:3003;
    proxy_set_header Host $host;
  }

  location /api/jobs {
    proxy_pass http://civicverse_rebuilt_backend:3003;
    proxy_set_header Host $host;
  }

  location /api/governance {
    proxy_pass http://civicverse_rebuilt_backend:3003;
    proxy_set_header Host $host;
  }

  location /api/status {
    proxy_pass http://civicverse_rebuilt_backend:3003;
    proxy_set_header Host $host;
  }

  # Game Server Routes (Port 8080) - Catch-all for other /api
  location /api/ {
    proxy_pass http://civicverse_rebuilt_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
