name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Frontend Workspace
        run: npm run build --workspace=frontend
        env:
          NODE_ENV: production

      - name: Verify Frontend Distribution
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::Frontend build failed - frontend/dist/index.html was not found"
            exit 1
          fi

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          REPO_LOWER=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          echo "Repository: ${REPO_LOWER}"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      
      - name: Validate Deployment Configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing required Actions variable DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing required Actions secret DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing required Actions secret DEPLOY_KEY}"

          port="${DEPLOY_PORT:-22}"
          if ! [[ "$port" =~ ^[0-9]{1,5}$ ]] || ((10#$port < 1 || 10#$port > 65535)); then
            echo "::error::DEPLOY_PORT must be an integer between 1 and 65535"
            exit 1
          fi

      - name: SSH Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          script: |
            set -e
            echo "Starting deployment to ${{ github.event.inputs.environment || 'production' }}..."
            cd /app/civicverse || { echo "ERROR: Deploy directory not found"; exit 1; }
            
            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull || { echo "ERROR: Failed to pull images"; exit 1; }
            
            echo "Starting services..."
            docker compose -f docker-compose.prod.yml up -d || { echo "ERROR: Failed to start services"; exit 1; }
            
            echo "Verifying deployment..."
            sleep 5
            docker compose -f docker-compose.prod.yml ps
            echo "✓ Deployment completed successfully"
      
      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✓ Deployment successful for ${{ github.event.inputs.environment || 'production' }}"
          else
            echo "✗ Deployment failed"
            exit 1
          fi
