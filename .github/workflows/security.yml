name: Security & Dependency Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Audit Monorepo Dependencies
        run: npm audit --audit-level=low

  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.99.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch || 'main' }}
          head: HEAD
          extra_args: --only-verified --json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          post-processed-sarif-path: codeql-processed-results

      - name: Fail when CodeQL reports findings
        shell: bash
        run: |
          mapfile -d '' sarif_files < <(find codeql-processed-results -type f -name '*.sarif' -print0)
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "::error::CodeQL analysis did not produce a SARIF results file"
            exit 1
          fi

          finding_count=0
          for sarif_file in "${sarif_files[@]}"; do
            count=$(jq '[.runs[].results[]?] | length' "$sarif_file")
            finding_count=$((finding_count + count))
          done

          if [ "$finding_count" -gt 0 ]; then
            echo "::error::CodeQL reported $finding_count finding(s)"
            exit 1
          fi
