name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Monorepo Build & Verification
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      
      - name: Install Monorepo Dependencies
        run: npm install
      
      - name: Verify Backend Syntax
        run: |
          node -c backend/index.js
          node -c backend/start.js
          node -c backend/multiplayer-server.js
          echo "Backend syntax validated successfully."

      - name: Build Frontend Application
        run: npm run build --workspace=frontend

      - name: Verify Static Distribution Bundle
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend static bundle verified successfully."

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Job 2: Verify Project Architecture & Godot Engine Assets
  quality-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Verify Core Repository Structure & Packages
        run: |
          test -f README.md
          test -d frontend
          test -d backend
          test -d packages
          test -d packages/civic-foyer/godot-foyer
          test -f packages/civic-foyer/godot-foyer/project.godot
          echo "Project structure and Godot workspace verified successfully."
