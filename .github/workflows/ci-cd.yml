name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      
      - name: Install Monorepo Dependencies
        run: npm ci
      
      - name: Build Frontend Application
        run: npm run build --workspace=frontend
        env:
          NODE_ENV: production

      - name: Verify Static Distribution Bundle
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::Frontend build failed - frontend/dist/index.html was not found"
            exit 1
          fi
          du -sh frontend/dist

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Backend Syntax
        run: |
          echo "Validating backend entry points..."
          node --check backend/index.js
          node --check backend/start.js
          node --check backend/multiplayer-server.js
          echo "✓ Backend syntax validated successfully"

  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Verify Core Repository Structure
        run: |
          echo "Checking root-level files and directories..."
          test -f README.md || { echo "ERROR: README.md not found"; exit 1; }
          test -d frontend || { echo "ERROR: frontend directory not found"; exit 1; }
          test -d backend || { echo "ERROR: backend directory not found"; exit 1; }
          test -d packages || { echo "ERROR: packages directory not found"; exit 1; }
          echo "Checking Godot workspace..."
          test -d packages/civic-foyer/godot-foyer || { echo "WARNING: Godot foyer not found"; }
          echo "✓ Project structure verified successfully"
