name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Build Static Production Bundle
        run: npm run build --workspace=frontend

      - name: Prepare Static Artifacts
        run: |
          touch frontend/dist/.nojekyll
          cp frontend/dist/index.html frontend/dist/404.html || true

      - name: Deploy to gh-pages branch (Legacy / Branch Mode Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          enable_jekyll: false

      - name: Setup GitHub Pages (Action Mode)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact (Action Mode)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages (Action Mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
