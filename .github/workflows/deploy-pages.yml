name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Frontend Production Bundle
        run: npm run build --workspace=frontend
        env:
          NODE_ENV: production

      - name: Verify Frontend Distribution
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::Frontend build failed - frontend/dist/index.html was not found"
            exit 1
          fi
          du -sh frontend/dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Wait for Pages Artifact Registration
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                core.info('GitHub Pages artifact is registered and ready to deploy.');
                return;
              }
              core.info(`Waiting for GitHub Pages artifact registration (${attempt + 1}/12)...`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('GitHub Pages artifact was uploaded but did not become available for deployment.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
