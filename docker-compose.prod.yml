version: '3.8'

services:
  civic-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: civic_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MULTIPLAYER_PORT=8080
      # Secrets should be injected via docker secrets in real prod
    ports:
      - "3003:3003" # API
      - "8080:8080" # WS
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - civic-net
    user: "civic"
    read_only: true
    tmpfs:
      - /tmp

  civic-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: civic_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      civic-backend:
        condition: service_healthy
    networks:
      - civic-net

networks:
  civic-net:
    driver: bridge
